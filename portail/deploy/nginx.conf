# Marches publics.
#
# This is the *initial* site file only. On first run `certbot --nginx` rewrites
# the installed copy at /etc/nginx/sites-available/marches, adding the 443 server
# block and the certificate paths. Copying this file over that one removes the
# TLS block, and every HTTPS request then falls through to whichever other site
# on the box answers first — a certificate-mismatch error, not an obvious
# outage. setup.sh will not overwrite an existing site file for that reason.
#
# To change the proxy rules on a live box, edit the installed file, or copy this
# one and re-run:  certbot install --cert-name <domain> --nginx
server {
    listen 80;
    listen [::]:80;
    server_name portail.civictrust.ma;

    # Listing responses carry forty consultations with their full text; gzip
    # takes a page from tens of kilobytes to a few.
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Matches the application's own 1 MB JSON cap. A generous ceiling on an
    # unauthenticated path is a way to have someone stream at the disk before
    # anything rejects it.
    client_max_body_size 2m;

    # PDF generation streams the document as it is drawn. Buffering it would
    # hold a large invoice in nginx before a single byte reached the client,
    # and the default 60s read timeout is tight for a hundred-line invoice.
    location ~ ^/api/invoices/[0-9]+/pdf$ {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # A manual crawl triggered from the panel returns immediately (202) and runs
    # in the background, but `wait=true` blocks for the whole crawl.
    #
    # Matched without a trailing slash: `location /admin/` does not match a bare
    # `/admin`, and nginx answered that with its own 301 to `/admin/` instead of
    # letting the app redirect an old bookmark to the panel.
    location /admin {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
