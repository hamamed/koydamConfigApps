# Fortnite companion. TLS is added by certbot on first run.
server {
    listen 80;
    listen [::]:80;
    server_name fortnite.hamaprojects.com;

    # The catalogue responses are large — a page of forty cosmetics with their
    # image URLs — and gzip takes them from tens of kilobytes to a few.
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Small by default: the public API takes JSON and nothing larger, and a
    # generous ceiling on an unauthenticated path is a way to have someone
    # stream a few hundred megabytes at the disk before anything rejects it.
    client_max_body_size 2m;

    # The panel uploads wallpapers in batches — twenty files at up to twelve
    # megabytes each is what the application itself accepts, and nginx has to
    # allow at least as much or it rejects the request before the application
    # ever sees it. That was a 413 on any batch over 2 MB: a single wallpaper
    # got through, a selection of them did not.
    location /admin/ {
        client_max_body_size 260m;
        # A slow phone uploading 200 MB over mobile data needs longer than the
        # default 60 seconds to finish sending.
        client_body_timeout 300s;
        proxy_request_buffering on;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # A cosmetics sync rewrites 16,000 rows in one transaction. The default
        # 60s is enough, but a cold sync on a slow disk is not worth a 504.
        proxy_read_timeout 120s;
    }
}
