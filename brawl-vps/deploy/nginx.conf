# Reverse proxy for the Brawl Stats API.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/brawl-api
#   sudo ln -s /etc/nginx/sites-available/brawl-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get TLS (this rewrites the file to add the 443 block automatically):
#   sudo certbot --nginx -d api.yourdomain.com
#
# Replace api.yourdomain.com throughout before applying.

upstream brawl_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Certbot writes its challenge here; it must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else goes to TLS. Comment this out until certbot has run,
    # or the redirect will point at a listener that doesn't exist yet.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    # certbot --nginx fills these in.
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/brawl-api.access.log;
    error_log  /var/log/nginx/brawl-api.error.log;

    # A JSON API — nothing here is large, so a small body cap blocks junk.
    client_max_body_size 16k;

    limit_req_status 429;

    location / {
        # Second layer of rate limiting, in front of the app's own. Cheap to
        # enforce here and it keeps Node from ever seeing a flood.
        #
        # Declared per-location rather than at server level so that the sibling
        # /health block below simply never inherits it. nginx has no
        # 'limit_req off;' — that fails validation with 'invalid parameter "off"'
        # — so scoping the directive is the only clean way to exempt a location.
        limit_req zone=brawl_api burst=40 nodelay;

        proxy_pass http://brawl_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app sets `trust proxy 1` and reads this to rate-limit per real
        # client IP. Without it every request looks like it came from 127.0.0.1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Generous read timeout: a cache miss means waiting on Supercell.
        proxy_connect_timeout 5s;
        proxy_send_timeout    20s;
        proxy_read_timeout    20s;

        # Let the app's own X-Cache header through untouched.
        proxy_pass_header X-Cache;
    }

    # Health checks are never throttled — this location declares no limit_req
    # and inherits none, since the directive is scoped to 'location /' above.
    location = /health {
        access_log off;
        proxy_pass http://brawl_api;
        proxy_set_header Host $host;
    }

    # Wallpaper files, unthrottled for the same reason as /health: a sibling
    # location inherits no limit_req from 'location /'.
    #
    # A gallery screen requests one file per visible tile, so a single screen
    # open is dozens of requests in one second. Against `rate=10r/s burst=40`
    # that is a 503 on most of them, and the app can only render a broken-image
    # icon. These are static bytes from local disk — they cost nothing to serve
    # and never touch the upstream API the limit exists to protect.
    location /wallpapers/ {
        proxy_pass http://brawl_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app caches these itself; this stops a re-open re-fetching them.
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# NOTE: this zone must live in the `http` block, not inside `server`.
# Add it to /etc/nginx/nginx.conf instead of here if nginx complains:
#   limit_req_zone $binary_remote_addr zone=brawl_api:10m rate=10r/s;
