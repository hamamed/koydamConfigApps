# nginx front end for MineBox.
#
# Two jobs: terminate TLS, and serve the preview images straight from disk so Node never
# touches a byte of the traffic that dominates this app — every card in every grid.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/minebox
#   sudo ln -s /etc/nginx/sites-available/minebox /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d minebox.hamaprojects.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream minebox_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

# Throttle the API without touching asset delivery.
limit_req_zone $binary_remote_addr zone=minebox_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name minebox.hamaprojects.com;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minebox.hamaprojects.com;

    ssl_certificate     /etc/letsencrypt/live/minebox.hamaprojects.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minebox.hamaprojects.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Must be at least MAX_UPLOAD_MB, plus headroom for multipart overhead. A .mcworld is the
    # reason this is far larger than the other services on this box.
    client_max_body_size 80M;

    access_log /var/log/nginx/minebox.access.log;
    error_log  /var/log/nginx/minebox.error.log;

    # ── Preview images, served directly ──────────────────────────────────────
    #
    # Filenames are stable per item — replacing a file reuses the name it already had — so a
    # long max-age is safe, and `must-revalidate` keeps clients honest once it expires.
    location /storage/previews/ {
        alias /opt/minebox/storage/previews/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    # The downloadable files are deliberately NOT served from here.
    #
    # They go through /d/:id in the application, which restores the uploader's filename —
    # Minecraft names an imported pack after the file it arrived in, and the name on disk is a
    # slug plus an id fragment. Exposing this directory as well would create a second URL for
    # the same bytes that gets that wrong and counts no download.
    location /storage/files/ { return 404; }

    location /assets/ {
        alias /opt/minebox/public/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Universal links. Apple's CDN will not follow a redirect and will not accept a rewritten
    # path, so this must proxy straight through to the app over HTTPS.
    location = /.well-known/apple-app-site-association {
        proxy_pass http://minebox_app;
        include /etc/nginx/proxy_params;
        default_type application/json;
    }

    # ── Application ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=minebox_api burst=30 nodelay;
        proxy_pass http://minebox_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Downloads. Excluded from the rate limit above on purpose: a player fetching three addons
    # in a row is the app working, not abuse, and a 429 there looks like a broken download.
    location /d/ {
        proxy_pass http://minebox_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # A 60 MB world over a phone connection outlasts the default.
        proxy_read_timeout 300s;
        # Streamed straight through rather than spooled to disk first, so the download starts
        # immediately instead of after nginx has buffered the whole archive.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://minebox_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Uploads of tens of megabytes over a slow connection outlast the default timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
