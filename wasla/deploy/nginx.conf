# Wasla. TLS is added by certbot on first run.
server {
    listen 80;
    listen [::]:80;
    server_name wassla.hamaprojects.com;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # The public API takes nothing larger than an events batch, which the
    # application caps at 64 kB itself.
    client_max_body_size 2m;

    # A bulk import is one CSV plus up to 100 pictures (8 MB) and sounds (5 MB)
    # in a single request. The application checks each file; this only has to
    # let a real batch through.
    location = /admin/import {
        client_max_body_size 200m;
        client_body_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A question form carries a picture (8 MB) and a sound (5 MB) together.
    location /admin/ {
        client_max_body_size 16m;
        client_body_timeout 120s;

        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
