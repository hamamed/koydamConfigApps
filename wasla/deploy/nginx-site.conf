# The public site's domain (SITE_URL). Same service as wassla.hamaprojects.com;
# the app decides what each domain serves (src/middleware/site-host.js).
# Installed as /etc/nginx/sites-available/chabbek; TLS is added by certbot:
#   sudo certbot --nginx -d chabbek.com -d www.chabbek.com
server {
    listen 80;
    listen [::]:80;
    server_name chabbek.com www.chabbek.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:3700;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
