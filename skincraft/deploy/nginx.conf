# nginx front end for SkinCraft.
#
# Two jobs: terminate TLS, and serve the storage tree straight from disk so Node never touches
# a byte of image traffic — which is the overwhelming majority of the bandwidth this app uses.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/skincraft
#   sudo ln -s /etc/nginx/sites-available/skincraft /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d vps.yourdomain.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream skincraft_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Throttle the API without touching asset delivery.
limit_req_zone $binary_remote_addr zone=skincraft_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vps.yourdomain.com;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vps.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/vps.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Must be at least MAX_UPLOAD_MB, plus headroom for multipart overhead.
    client_max_body_size 16M;

    access_log /var/log/nginx/skincraft.access.log;
    error_log  /var/log/nginx/skincraft.error.log;

    # ── Static assets, served directly ───────────────────────────────────────
    #
    # Filenames are stable per skin, so a long max-age is safe: replacing a template is an
    # explicit admin action, and `must-revalidate` keeps clients honest after it expires.
    location /storage/ {
        alias /srv/skincraft/storage/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        alias /srv/skincraft/public/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Universal links. Apple's CDN will not follow a redirect and will not accept a rewritten
    # path, so this must proxy straight through to the app over HTTPS.
    location = /.well-known/apple-app-site-association {
        proxy_pass http://skincraft_app;
        include /etc/nginx/proxy_params;
        default_type application/json;
    }

    # ── Application ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=skincraft_api burst=30 nodelay;
        proxy_pass http://skincraft_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://skincraft_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Uploads of a dozen megabytes over a slow connection outlast the default timeout.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
