<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Platform</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/panel/vendor.css">
<link rel="stylesheet" href="/panel/css/koydam.css">
<link rel="stylesheet" href="/panel/css/admin.css">
</head>

<body class="ad-body">

<div class="ad-shell">

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <aside class="ad-sidebar" id="sidebar">
    <!-- The real mark, and the same lockup shape the agency site uses: name
         first, role underneath. A generic glyph in an accent square said
         nothing about whose product this is. -->
    <a class="ad-brand" href="/">
      <img class="kd-brand-mark" src="/panel/logo/logo.png" alt=""
           width="23" height="26">
      <span>Koydam<small>Control panel</small></span>
    </a>

    <nav class="ad-nav flex-grow-1" id="nav">
      <div class="ad-nav-label">Overview</div>
      <a class="ad-nav-link" href="#/" data-view="home">
        <svg class="lucide"><use href="/panel/icons.svg#i-gauge"></use></svg> Dashboard
      </a>

      <div class="ad-nav-label">Apps</div>
      <div id="appNav"></div>

      <div class="ad-nav-label">Operations</div>
      <a class="ad-nav-link" href="#/schedule" data-view="schedule">
        <svg class="lucide"><use href="/panel/icons.svg#i-calendar-clock"></use></svg> Scheduled changes
      </a>

      <div class="ad-nav-label" data-admin-only>Infrastructure</div>
      <a class="ad-nav-link" href="#/services" data-view="services" data-admin-only>
        <svg class="lucide"><use href="/panel/icons.svg#i-server"></use></svg> Services
      </a>
      <a class="ad-nav-link" href="#/settings" data-view="settings" data-admin-only>
        <svg class="lucide"><use href="/panel/icons.svg#i-settings"></use></svg> Settings
      </a>
      <a class="ad-nav-link" href="#/alerts" data-view="alerts" data-admin-only>
        <svg class="lucide"><use href="/panel/icons.svg#i-bell"></use></svg> Alerts
      </a>
      <a class="ad-nav-link" href="#/audit" data-view="audit" data-admin-only>
        <svg class="lucide"><use href="/panel/icons.svg#i-scroll-text"></use></svg> Audit log
      </a>
      <a class="ad-nav-link" href="#/users" data-view="users" data-owner-only>
        <svg class="lucide"><use href="/panel/icons.svg#i-users"></use></svg> Team
      </a>
    </nav>

    <!-- Nav links, like every other panel on this box: a destination and a way
         out. Who you are signed in as belongs in the topbar chip. -->
    <div class="ad-sidebar-foot">
      <a class="ad-nav-link" href="#/account">
        <svg class="lucide"><use href="/panel/icons.svg#i-shield"></use></svg> Your account
      </a>
      <button class="ad-nav-link w-100 border-0 bg-transparent text-start" id="logout" type="button">
        <svg class="lucide"><use href="/panel/icons.svg#i-log-out"></use></svg> Sign out
      </button>
    </div>
  </aside>

  <!-- ── Main ────────────────────────────────────────────────────────── -->
  <div class="ad-main">
    <header class="ad-topbar">
      <button class="btn btn-kd-ghost btn-sm d-lg-none" id="menuToggle" type="button">
        <svg class="lucide" width="20" height="20"><use href="/panel/icons.svg#i-menu"></use></svg>
      </button>
      <h1 class="ad-page-title mb-0" id="pageTitle">Dashboard</h1>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="kd-faint small" id="lastUpdated"></span>
        <span class="kd-tag" id="userChip" title="Signed in">…</span>
        <button class="btn btn-sm btn-kd-outline d-flex align-items-center gap-1"
                id="refresh" type="button">
          <svg class="lucide" width="15" height="15" id="refreshIcon">
            <use href="/panel/icons.svg#i-refresh-cw"></use>
          </svg>
          <span class="d-none d-sm-inline">Refresh</span>
        </button>
      </div>
    </header>

    <main class="ad-content" id="view"></main>
  </div>

</div>

<div class="ad-toasts" id="toasts"></div>

<script src="/panel/app.js"></script>
</body>
</html>
