# Everything this box deploys.
#
# One block per service. deploy.sh reads this and nothing else — adding an app
# is a block here, never an edit to the script.
#
#   name     the block header, and what you type: sudo /opt/deploy.sh brawl
#   repo     git URL to pull from
#   subdir   directory inside that repo             (optional, default: root)
#   target   where it is installed
#   type     node | static
#   unit     systemd unit to restart                (node only)
#   health   URL that must return 2xx after deploying
#   overlay  folder under deploy/overlays/ to apply (optional)
#   sso      app slug; wires PLATFORM_URL and SERVICE_TOKEN into the service's
#            .env so it uses the one platform login    (optional)
#   preserve what rsync must not touch, space separated  (optional; replaces
#            the default). A leading slash anchors to the install root -
#            without it, `wallpapers` also matches src/wallpapers/.
#   build    command run in target after install    (optional)
#   enabled  no = keep the entry, skip the deploy   (optional)
#
# All three share one repository, cloned once to /opt/src/koydamConfigApps.
# Order matters: platform goes first, because it owns the overlay files and the
# login every other panel redirects to.

[platform]
repo    = https://github.com/hamamed/koydamConfigApps.git
subdir  = platform-api
target  = /opt/platform-api
type    = node
unit    = platform-api
health  = https://config.hamaprojects.com/health

[brawl]
repo    = https://github.com/hamamed/koydamConfigApps.git
subdir  = brawl-vps
target  = /opt/brawl-vps
type    = node
unit    = brawl-api
health  = https://api.hamaprojects.com/health
overlay = brawl
sso     = brawl-stats
# data/ holds both hand-maintained source (hypercharge-overrides.json, in the
# repo) and generated state (brawler-meta.json, 170KB from `npm run
# sync:brawlers`). Excluding the whole directory would mean edits to the first
# never reach the server, so only the generated file is named.
preserve = node_modules .git .env /storage /wallpapers /uploads /data/brawler-meta.json

[skincraft]
repo    = https://github.com/hamamed/koydamConfigApps.git
subdir  = skincraft
target  = /opt/skincraft
type    = node
unit    = skincraft
health  = https://skincraft.hamaprojects.com/api/v1/health
overlay = skincraft
sso     = skincraft

[minebox]
repo    = https://github.com/hamamed/koydamConfigApps.git
subdir  = minebox
target  = /opt/minebox
type    = node
unit    = minebox
health  = https://minebox.hamaprojects.com/api/v1/health
overlay = minebox
sso     = minebox
# storage/ holds both halves of the catalogue — the uploaded .mcaddon/.mcworld files and the
# preview images rendered from them — and neither is in the repo. Anchored, because an
# unanchored `storage` would also match any src/storage/ added later.
preserve = node_modules .git .env /storage /data

# ── Not yet on the box ──────────────────────────────────────────────────────
#
# The template for the next one. Add the directory to the repo, fill this in,
# drop `enabled = no`, and it deploys with everything above — no code change.
#
# [koydam-agency]
# repo    = https://github.com/hamamed/koydamConfigApps.git
# subdir  = koydam-agency
# target  = /var/www/koydam-agency
# type    = static
# health  = https://koydam.com
# enabled = no

[fortnite]
repo    = https://github.com/hamamed/koydamConfigApps.git
subdir  = fortnite
target  = /opt/fortnite
type    = node
unit    = fortnite
health  = https://fortnite.hamaprojects.com/api/v1/health
overlay = fortnite
sso     = fortnite
preserve = node_modules .git .env /data
