# Everything this box deploys.
#
# One block per service. deploy.sh reads this and nothing else — adding an app
# is a block here, never an edit to the script.
#
#   name     the block header, and what you type: sudo /opt/deploy.sh brawl
#   repo     git URL to pull from
#   target   where it is installed
#   type     node | static
#   unit     systemd unit to restart      (node only)
#   health   URL that must return 2xx after deploying
#   overlay  folder under deploy/overlays/ to apply  (optional)
#   build    command run in target after install     (optional)
#   enabled  no = keep the entry, skip the deploy    (optional)
#
# Order matters: platform goes first, because it owns the overlay files and
# the login every other panel redirects to.

[platform]
repo    = https://github.com/hamamed/platform-api.git
target  = /opt/platform-api
type    = node
unit    = platform-api
health  = https://config.hamaprojects.com/health

[brawl]
repo    = https://github.com/hamamed/brawl-vps.git
target  = /opt/brawl-vps
type    = node
unit    = brawl-api
health  = https://api.hamaprojects.com/health
overlay = brawl

[skincraft]
repo    = https://github.com/hamamed/skincraft.git
target  = /opt/skincraft
type    = node
unit    = skincraft
health  = https://skincraft.hamaprojects.com/api/v1/health
overlay = skincraft

