# Marches publics. TLS is added by certbot on first run.
server {
    listen 80;
    listen [::]:80;
    server_name bdc.civictrust.ma;

    # Listing responses carry forty consultations with their full text; gzip
    # takes a page from tens of kilobytes to a few.
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Matches the application's own 1 MB JSON cap. A generous ceiling on an
    # unauthenticated path is a way to have someone stream at the disk before
    # anything rejects it.
    client_max_body_size 2m;

    # PDF generation streams the document as it is drawn. Buffering it would
    # hold a large invoice in nginx before a single byte reached the client,
    # and the default 60s read timeout is tight for a hundred-line invoice.
    location ~ ^/api/invoices/[0-9]+/pdf$ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # A manual crawl triggered from the panel returns immediately (202) and runs
    # in the background, but `wait=true` blocks for the whole crawl.
    location /admin/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
